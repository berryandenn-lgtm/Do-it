.as{padding:10px 0;border-bottom:1px solid var(--line)}

.ov{position:absolute;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;z-index:9}

.code{font:400 34px "Jua",sans-serif;letter-spacing:4px;text-align:center;margin:10px 0}

#toast{position:absolute;left:16px;right:16px;bottom:74px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;display:flex;justify-content:space-between;gap:10px;z-index:20}

.bigimg{display:block;width:100%;max-height:60vh;object-fit:cover;border-radius:14px;margin-top:8px}
.thumb{display:flex;gap:10px;align-items:center}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const FLOW=[

chat={step:0,msgs:[{a:1,t:FLOW[0].q()}],ans:{},sel:[],plan:null};render()}

 if(st.k==='end'){makePlan();return}
 do{chat.step++}while(FLOW[chat.step]&&FLOW[chat.step].when&&!FLOW[chat.step].when());
 chat.msgs.push({a:1,t:FLOW[chat.step].q()});render()}
function makePlan(){const a=chat.ans;const total={'1시간 이하':45,'2~3시간':150,'4시간 이상':270}[a.time]||90;
 let items=(a.subj||'').split(/[,，、\n]+/).map(s=>s.trim()).filter(Boolean).map(s=>s+(a.amt?' · '+a.amt:''));
 if(a.mate==='넣을게요'&&TI.length){const x=TI[0];items.push(x.t);TI=TI.slice(1);updateDoc(doc(db,'throws',x.id),{st:'수락'})}
 const max=total<=60?2:total<=180?3:5;const extra=items.slice(max);items=items.slice(0,max);
 const m=Math.max(10,Math.round(total/Math.max(items.length,1)/5)*5);
 let d=new Date();d.setMinutes(d.getMinutes()<30?30:60,0,0);
 chat.plan={total,extra,items:items.map(t=>{const time=d.toTimeString().slice(0,5);d=new Date(d.getTime()+m*60000);return{t,m,time}})};render()}
function vChat(){let h=chat.msgs.map(m=>`<div class="bub ${m.a?'':'me'}">${esc(m.t)}</div>`).join('');
 if(chat.plan){const p=chat.plan;h+=`<div class="card"><h3>오늘의 계획</h3>${p.items.length?p.items.map((x,i)=>`<div class="todo"><span style="flex:1">${x.time} ${esc(x.t)}<small>${x.m}분</small></span><button class="ghost" data-a="rmplan" data-v="${i}" aria-label="빼기">✕</button></div>`).join(''):'<p class="mute">항목이 없어요. 처음부터 다시 해볼까요?</p>'}${p.extra.length?`<p class="mute">여유 되면: ${p.extra.map(esc).join(', ')}</p>`:''}<div class="two"><button class="pri" data-a="reg">이대로 등록</button><button class="ghost" data-a="startChat">다시 하기</button></div></div>`;return h}

 h+=`<div class="row" style="margin-top:12px"><input id="ci" placeholder="편하게 이야기해 보세요" autocomplete="off" ${chat.busy?'disabled':''}><button class="pri" data-a="send">보내기</button></div>${chat.n>=3&&!chat.busy?'<button class="ghost" style="margin:10px 8px 0 0" data-a="wrap">이제 계획으로 정리해 줘</button>':''}<button class="ghost" style="margin-top:10px" data-a="quit">그만두기</button>`;return h}

 <div class="row" style="margin-top:12px"><input id="ci" placeholder="직접 입력" autocomplete="off"><button class="pri" data-a="send">${st.multi?'다음':'보내기'}</button></div>

function vTodo(){const L=S.todos;
 return `<div class="card"><div class="row"><h3 style="flex:1;margin:0">오늘의 투두</h3><button class="ghost" data-a="startChat">AI와 정리</button><button class="ghost" data-a="hist">지난 플래너</button></div>

async function aiTurn(t,force){t=(t||'').trim();if((!force&&!t)||chat.busy)return;

 const log=chat.msgs.map(m=>(m.a?'코치: ':'학생: ')+m.t).join('\n');
 const p=`너는 공부 메이트 앱의 다정한 학습 코치야. 학생과 대화하며 오늘 할 일을 학생이 스스로 떠올리게 돕고, 마지막에 오늘의 플래너를 만들어 준다.
규칙: 부드러운 존댓말. 질문은 한 번에 하나. 2문장 이내로 짧게. 학생 말을 그대로 옮겨 적지 말 것. 컨디션, 쓸 수 있는 시간, 마감과 부담, 가장 급한 것, 미뤄 둔 것을 충분히 물어본 뒤(학생 답변이 최소 4번 쌓이기 전에는 플래너를 만들지 말 것) 현실적인 용량을 따져 우선순위, 구체적 분량과 순서, 쉬는 시간을 직접 판단해 재구성한다. 학생이 힘들다고 하면 분량을 줄인다. ${force?'학생이 지금 정리를 요청했으니 반드시 done을 true로 하고 플래너를 만들어라.':''}
참고 정보: ${ctx}

${log}
JSON만 출력: {"reply":"학생에게 할 말(플래너를 만들 때는 한두 문장 요약)","choices":["학생이 눌러서 답할 수 있는 짧은 1인칭 답변 2~4개(직접 입력도 가능하니 대표적인 답만, 플래너를 만들 때는 빈 배열)"],"done":false,"plan":null} 또는 done이 true면 plan은 {"items":[{"t":"구체적인 할 일 문장","m":분(5의 배수),"time":"HH:MM"}],"extra":["여유 되면 할 일"]}. items는 2~5개, time은 현재 시각 이후.`;
 try{const r=await AI.json(p,{cache:false});chat.msgs.push({a:1,t:r.reply||'좋아요.'});chat.choices=Array.isArray(r.choices)?r.choices.slice(0,4).map(String):[];

 sheet(`<h3>내 코드가 만들어졌어요</h3><div class="code">${c}</div><p class="mute" style="text-align:center">이 코드는 바꿀 수 없어요. 친구에게 알려주세요.</p><button class="pri" style="width:100%" data-a="close">시작하기</button>`);listen();render()},

ign:async v=>{TI=TI.filter(y=>y.id!==v);await updateDoc(doc(db,'throws',v),{st:'거절'});act.inbox();render()},
toss:async()=>{const t=($('#tk').value||'').trim();if(!t)return;await addDoc(collection(db,'throws'),{from:S.code,to:S.sel,t,st:'대기',at:Date.now()});sheet('');toast('던졌어요 ✈️ 답을 기다리는 중')},
poke:async()=>{const c=S.sel;const left=1800000-(Date.now()-(S.pokeAt[c]||0));if(left>0)return toast(`조금 있다 다시 찌를 수 있어요 (${Math.ceil(left/60000)}분 뒤)`);S.pokeAt[c]=Date.now();lsave();await addDoc(collection(db,'pokes'),{from:S.code,to:c,m:POKE[Math.random()*POKE.length|0],at:Date.now()});toast('콕 찔렀어요 👉')},
say:async v=>{const text=($('#sy').value||'').trim();S.say[v]=text;lsave();await setDoc(doc(db,'says',S.code+'_'+v),{from:S.code,to:v,text,at:Date.now()});toast(`${nm(v)}님 화면에 남겼어요 💌`)},
unpeek(){pk=null;$('#peek').hidden=true;render()},
addT(){const t=($('#td').value||'').trim();if(!t)return;S.todos.push({t,src:'',done:false});save();render()},
delT(v){S.todos.splice(+v,1);save();render()},
addA(){const t=($('#ai').value||'').trim();if(!t)return;if(asTab==='j'){(J[S.sel]=J[S.sel]||[]).push({id:Date.now(),t});sj()}else{S.mine.push({id:Date.now(),t,g:0});save()}render()},
g(v){const[k,id,n]=v.split('|');const i=+n;
 if(k==='j'){const c=S.sel;S.jp[c]=S.jp[c]||{};const nv=(S.jp[c][id]||0)===i?i-1:i;S.jp[c][id]=nv;const kk=c+'|'+id;save();
  if(nv===5){JD.add(kk);setTimeout(()=>{if(JD.has(kk)){JD.delete(kk);S.jx[c]=[...(S.jx[c]||[]),id];save();render()}},3000)}
  render();return}
 const L=S.mine;const it=L.find(x=>x.id==id);it.g=it.g===i?i-1:i;
 if(it.g===5){it.done=true;setTimeout(()=>{if(it.done){const x=L.indexOf(it);if(x>=0)L.splice(x,1);save();render()}},3000)}save();render()},
undo(v){if(asTab==='j'){const c=S.sel;JD.delete(c+'|'+v);S.jp[c][v]=4;save();render();return}const it=S.mine.find(x=>x.id==v);it.done=false;it.g=4;save();render()}});
let AU,PN='',AM='login',NOCLOSE=false;
const IN='style="width:100%;margin:6px 0"';
function authUI(){NOCLOSE=true;sheet(`<h3>Do It</h3><div class="seg"><button class="${AM==='login'?'on':''}" data-a="am" data-v="login">로그인</button><button class="${AM==='up'?'on':''}" data-a="am" data-v="up">회원가입</button></div>${AM==='up'?`<input id="an" maxlength="8" placeholder="이름 (친구에게 보여요)" ${IN}>`:''}<input id="aid" placeholder="아이디 (영문·숫자 4~16자)" autocapitalize="none" autocomplete="username" ${IN}><input id="apw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="${AM==='up'?'new-password':'current-password'}" ${IN}><p class="mute" id="aerr"></p><button class="pri" style="width:100%" data-a="authGo">${AM==='up'?'가입하기':'로그인'}</button>${AM==='up'?'<p class="mute">비밀번호를 잊으면 찾을 수 없으니 꼭 기억해 두세요.</p>':''}`)}
function showErr(e){const m='저장·불러오기에 실패했어요 ('+(e.code||e.message)+'). Firebase의 Firestore 데이터베이스와 규칙을 확인해 주세요.';const a=$('#aerr');if(a)a.textContent=m;else sheet('<h3>오류</h3><p class="mute">'+m+'</p>')}
async function makeProfile(n){let c;for(let i=0;i<6;i++){c=gen();if(!(await getDoc(doc(db,'users',c))).exists())break}
 await setDoc(doc(db,'users',c),{uid,name:n,friends:[],todos:S.todos,mine:S.mine,day:S.day});S.code=c;S.name=n;S.reg=1;S.pokeSeen=Date.now();lsave();NOCLOSE=false;
 sheet(`<h3>내 코드가 만들어졌어요</h3><div class="code">${c}</div><p class="mute" style="text-align:center">이 코드는 바꿀 수 없어요. 친구에게 알려주세요.</p><button class="pri" style="width:100%" data-a="close">시작하기</button>`);listen();render()}
async function start(){let q;try{q=await getDocs(query(collection(db,'users'),where('uid','==',uid)))}catch(e){return showErr(e)}
 if(q.empty){if(PN){const n=PN;PN='';await makeProfile(n).catch(showErr)}else{NOCLOSE=true;sheet(`<h3>이름을 알려 주세요</h3><div class="row"><input id="nn" maxlength="8" placeholder="예: 민지"><button class="pri" data-a="signup">시작</button></div>`)}return}
 const d=q.docs[0],dd=d.data();S.code=d.id;S.name=dd.name;S.reg=1;if(S.day&&dd.day===S.day)S.todos=dd.todos||[];if(dd.mine)S.mine=dd.mine;lsave();NOCLOSE=false;sheet('');listen();render()}
Object.assign(act,{
am(v){AM=v;authUI()},
signup(){const n=($('#nn').value||'').trim();if(n)makeProfile(n).catch(showErr)},
authGo:async()=>{const id=($('#aid').value||'').trim().toLowerCase(),pw=$('#apw').value||'',n=($('#an')?$('#an').value:'').trim();const err=m=>{$('#aerr').textContent=m};
 if(!/^[a-z0-9]{4,16}$/.test(id))return err('아이디는 영문 소문자·숫자 4~16자예요.');if(pw.length<6)return err('비밀번호는 6자 이상이에요.');if(AM==='up'&&!n)return err('이름을 입력해 주세요.');
 try{if(AM==='up'){PN=n;await createUserWithEmailAndPassword(AU,id+'@doit.app',pw)}else await signInWithEmailAndPassword(AU,id+'@doit.app',pw)}
 catch(e){PN='';const c=e.code||'';err(c.includes('email-already')?'이미 있는 아이디예요.':/invalid-credential|wrong-password|user-not-found/.test(c)?'아이디나 비밀번호가 맞지 않아요.':c.includes('operation-not-allowed')?'Firebase에서 이메일/비밀번호 로그인을 켜 주세요.':c.includes('weak')?'비밀번호가 너무 약해요.':'실패했어요: '+c)}},

find:async()=>{const c=($('#fc').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
 try{if(c===S.code)return sheet(vFr(0,'내 코드예요. 친구의 코드를 입력해 주세요.'));
  if(S.friends.includes(c))return sheet(vFr(0,'이미 연결된 친구예요.'));
  const s=await getDoc(doc(db,'users',c));if(!s.exists())return sheet(vFr(0,'해당 코드를 찾을 수 없어요. 친구의 [친구 관리] 화면에 있는 코드를 다시 확인해 주세요.'));

  if((d.friends||[]).length>=3)return sheet(vFr(0,'상대방의 친구 자리가 가득 찼어요.'));
  sheet(vFr(c))}catch(e){sheet(vFr(0,'검색에 실패했어요 ('+(e.code||e.message)+'). 인터넷 연결과 Firestore 규칙을 확인해 주세요.'))}}});
S.hist=S.hist||{};S.jp=S.jp||{};S.jx=S.jx||{};S.tc=S.tc||{d:'',c:{}};

if(!FBOK){sheet('<h3>Firebase를 불러오지 못했어요</h3><p class="mute">채팅 미리보기가 아니라 Chrome이나 Safari 같은 브라우저에서 열어 주세요. 인터넷 연결도 확인해 주세요.</p>')}else if(!FB.apiKey){sheet('<h3>설정이 필요해요</h3><p class="mute">파일 위쪽의 FB 부분에 Firebase 설정 코드를 붙여넣어 주세요.</p>')}
else{const app=initializeApp(FB);db=getFirestore(app);const au=getAuth(app);AU=au;onAuthStateChanged(au,u=>{if(u){uid=u.uid;start()}else{uid=null;authUI()}})}
